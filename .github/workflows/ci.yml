name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - run: node tests/e2e/react-smoke.mjs dist/react.html
      - uses: actions/upload-artifact@v4
        with:
          name: tailor-build
          path: |
            dist/index.html
            dist/react.html
